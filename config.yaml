fpl:
  team_id: 4835628

storage:
  db_path: data/fpl_autopilot.db

understat:
  season: "2026"   # Understat uses the start year; "2026" = the 2026/27 season

databank:
  # Live fetch ONLY the current season (R9): past seasons are frozen in the DB
  # from the trusted local snapshot — the live GitHub files are revision-unstable
  # (a partial re-fetch of 25-26 silently shifted xP values on 2026-08-25).
  seasons: ["2026-27"]

mode:
  current: manual  # auto | manual | hybrid

thresholds:
  min_ep_delta_for_transfer: 2.0
  min_ep_delta_for_hit_minus4: 4.0
  confidence_floor: 70
  max_transfers_per_gw_auto: 2
  max_hit_per_gw_auto: 4

deadguard:
  enabled: true
  warning_window_minutes: 120
  trigger_window_minutes: 30
  reeval_if_late_news: true
  reeval_lockout_minutes: 15
  scope:
    captain_vice: true
    bench_order: true
    auto_sub_flagged: true
    transfer_if_flagged: true
    transfer_if_underperform: false
    allow_hit: false
    min_ep_delta_for_transfer: 3.0

notifications:
  channel: telegram
  schedule:
    chip_preview_hours_before: 48
    transfer_preview_hours_before: 24
    final_reminder_hours_before: 2

xp_model:
  version: v2

unattended:
  enabled: false
  hours_before_deadline: 2

telegram:
  interactive: true

ai:
  enabled: true
  provider: deepseek   # deepseek | ollama | none
  deepseek:
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
  ollama:
    host: "http://localhost:11434"
    model: "qwen2.5:7b-instruct-q4_K_M"
  timeout_seconds: 60
  consecutive_failure_backoff: 3
  temperature: 0.2
  max_tokens_per_pane: 200
